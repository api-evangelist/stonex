naftiko: "1.0.0-alpha1"

info:
  label: StoneX Payments API
  description: >-
    StoneX Payments REST API for cross-border payment processing in 140+
    currencies with local currency acceptance and global settlement.
  tags:
    - Payments
    - Cross-Border Payments
    - FX
    - Finance
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      STONEX_PAYMENTS_CLIENT_ID: STONEX_PAYMENTS_CLIENT_ID
      STONEX_PAYMENTS_CLIENT_SECRET: STONEX_PAYMENTS_CLIENT_SECRET
      STONEX_PAYMENTS_ACCESS_TOKEN: STONEX_PAYMENTS_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: stonex-payments
      baseUri: https://fx-api.payments.stonex.com
      description: StoneX Payments API for cross-border payments and FX rates.
      authentication:
        type: bearer
        token: "{{STONEX_PAYMENTS_ACCESS_TOKEN}}"
      resources:
        - name: payments
          path: /payments
          description: Cross-border payment creation and management.
          operations:
            - name: create-payment
              method: POST
              description: Initiate a cross-border payment in local currency.
              body:
                type: json
                data:
                  amount: "{{tools.amount}}"
                  sell_currency: "{{tools.sell_currency}}"
                  buy_currency: "{{tools.buy_currency}}"
                  beneficiary:
                    name: "{{tools.beneficiary_name}}"
                    country: "{{tools.beneficiary_country}}"
                    account_number: "{{tools.account_number}}"
                    bank_code: "{{tools.bank_code}}"
                  payment_reference: "{{tools.payment_reference}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: list-payments
              method: GET
              description: List payments with optional status and date filters.
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                  description: Filter by payment status.
                - name: currency
                  in: query
                  type: string
                  required: false
                  description: Filter by currency (ISO 4217).
                - name: from_date
                  in: query
                  type: string
                  required: false
                  description: Start date filter.
                - name: to_date
                  in: query
                  type: string
                  required: false
                  description: End date filter.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: payment
          path: /payments/{paymentId}
          description: Individual payment retrieval.
          operations:
            - name: get-payment
              method: GET
              description: Get details of a specific payment by ID.
              inputParameters:
                - name: paymentId
                  in: path
                  type: string
                  required: true
                  description: Payment identifier.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: fx-rates
          path: /rates
          description: Foreign exchange rates.
          operations:
            - name: get-fx-rates
              method: GET
              description: Get indicative FX rates for a currency pair.
              inputParameters:
                - name: sell_currency
                  in: query
                  type: string
                  required: true
                  description: Source currency (ISO 4217).
                - name: buy_currency
                  in: query
                  type: string
                  required: true
                  description: Destination currency (ISO 4217).
                - name: amount
                  in: query
                  type: number
                  required: false
                  description: Amount to convert.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: stonex-payments-rest
      resources:
        - path: /v1/payments
          name: payments
          description: Cross-border payment operations.
          operations:
            - method: POST
              name: create-payment
              description: Initiate a cross-border payment.
              call: "stonex-payments.create-payment"
              with:
                amount: "rest.amount"
                sell_currency: "rest.sell_currency"
                buy_currency: "rest.buy_currency"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: GET
              name: list-payments
              description: List payments with filters.
              call: "stonex-payments.list-payments"
              with:
                status: "rest.status"
                currency: "rest.currency"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/fx-rates
          name: fx-rates
          description: FX rate queries.
          operations:
            - method: GET
              name: get-fx-rates
              description: Get indicative FX rate for a currency pair.
              call: "stonex-payments.get-fx-rates"
              with:
                sell_currency: "rest.sell_currency"
                buy_currency: "rest.buy_currency"
                amount: "rest.amount"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: stonex-payments-mcp
      transport: http
      tools:
        - name: create-payment
          description: Initiate a cross-border payment via StoneX.
          hints:
            readOnly: false
          call: "stonex-payments.create-payment"
          with:
            amount: "tools.amount"
            sell_currency: "tools.sell_currency"
            buy_currency: "tools.buy_currency"
            beneficiary_name: "tools.beneficiary_name"
            account_number: "tools.account_number"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-payments
          description: List cross-border payments with optional filters.
          hints:
            readOnly: true
            idempotent: true
          call: "stonex-payments.list-payments"
          with:
            status: "tools.status"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-payment
          description: Get details of a specific payment by ID.
          hints:
            readOnly: true
            idempotent: true
          call: "stonex-payments.get-payment"
          with:
            paymentId: "tools.paymentId"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-fx-rates
          description: Get indicative FX exchange rates for a currency pair.
          hints:
            readOnly: true
            idempotent: true
          call: "stonex-payments.get-fx-rates"
          with:
            sell_currency: "tools.sell_currency"
            buy_currency: "tools.buy_currency"
            amount: "tools.amount"
          outputParameters:
            - type: object
              mapping: "$."
