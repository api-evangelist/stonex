  - aid: stonex:stonex-clearing
    name: StoneX Clearing API
    description: The StoneX Clearing REST API provides programmatic access to accounts, trading, and document management for
      clearing clients. Supports OAuth 2.0 authentication with JWT tokens. Available in UAT (api.clearing.uat.stonex.com) and
      production (api.clearing.stonex.com).
    humanURL: https://docs.clearing.stonex.com/
    tags:
    - Clearing
    - Trading
    - Accounts
    - REST
    properties:
    - type: Documentation
      url: https://docs.clearing.stonex.com/docs
