  - aid: stonex:stonex-gf-api
    name: StoneX GF Futures API
    description: The StoneX GF (GAIN Futures) API provides institutional-grade access to futures trading including market data,
      order management, account and position tracking, margin calculations, contract lookup, and real-time price feeds for futures
      contracts.
    humanURL: https://futures-media.stonex.com/gfapi/index.html
    tags:
    - Futures
    - Trading
    - Market Data
    - Institutional
    properties:
