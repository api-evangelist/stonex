aid: stonex
name: StoneX
description: StoneX Group is a global financial services organization that provides execution, risk management, market intelligence,
  and post-trade services across asset classes and markets to institutional, commercial, and retail clients. StoneX offers
  REST APIs for payments, clearing, and futures trading with OAuth 2.0 authentication.
type: Index
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
