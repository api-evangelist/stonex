apis:
  - aid: stonex:stonex-payments
    name: StoneX Payments API
    description: The StoneX Payments REST API enables cross-border payment processing in 140+ currencies with local currency
      acceptance and settlement. Uses Bearer token authentication over HTTPS with TLS 1.3. Available in sandbox and production
      environments.
    humanURL: https://docs.payments.stonex.io/
    tags:
    - Payments
    - Cross-Border Payments
    - FX
    - REST
    properties:
    - type: Documentation
      url: https://docs.payments.stonex.io/
